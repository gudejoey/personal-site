# Pages CMS (https://pagescms.org): editing forms for the site's content.
# Each save commits to GitHub, which rebuilds and republishes the site.
media:
  - name: images
    label: Images
    input: src/img
    output: img
    categories: [image]
  - name: videos
    label: Videos
    input: src/mov
    output: mov
    categories: [video]

content:
  - name: projects
    label: Projects
    type: collection
    path: src/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [projects.11tydata.js]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: card_title
        label: Title on the Work page
        type: string
        description: Leave empty to use the page title.
      - name: order
        label: Position on the Work page
        type: number
        required: true
        description: 1 is first (leftmost). Projects are sorted by this number.
      - name: cover
        label: Cover image
        type: image
        required: true
      - name: cover_alt
        label: Cover image description (for screen readers)
        type: string
      - name: cover_ratio
        label: Cover shape
        type: select
        options:
          values: ["3 / 2", "4 / 3", "16 / 9", "1 / 1", "3 / 4", "2 / 3"]
        description: Width / height. Covers are cropped to this shape.
      - name: note
        label: Hover description
        type: text
      - name: lede
        label: Intro paragraph
        type: text
      - name: media
        label: Images & videos beside the text
        description: Optional. Shown next to the page content; nothing appears if empty.
        type: object
        list: true
        fields:
          - name: file
            label: Image
            type: image
            options:
              media: images
          - name: video
            label: Video (use instead of an image)
            type: file
            description: Plays silently on a loop. Keep it short and under ~20 MB.
            options:
              media: videos
              categories: [video]
          - name: alt
            label: Description (for screen readers)
            type: string
          - name: caption
            type: string
      - name: body
        label: Page content
        type: code
        options:
          format: markdown
        description: Markdown, or HTML for custom layouts.
      - name: sections_heading
        label: Sections heading
        type: string
        description: Optional heading above the sections, e.g. "Build sequence".
      - name: sections
        label: Sections (shows, steps…)
        description: Each section has its own title, text and any number of images/videos.
        type: object
        list: true
        fields:
          - name: label
            type: string
            description: Small label above the title, e.g. "Show" or "Step 01".
          - name: title
            type: string
          - name: meta
            label: Detail
            type: string
            description: Shown under the title, e.g. the year.
          - name: text
            type: text
            description: Markdown is allowed, e.g. [link text](https://…).
          - name: media
            label: Images & videos
            type: object
            list: true
            fields:
              - name: file
                label: Image
                type: image
                options:
                  media: images
              - name: video
                label: Video (use instead of an image)
                type: file
                description: Plays silently on a loop. Keep it short and under ~20 MB.
                options:
                  media: videos
                  categories: [video]
              - name: alt
                label: Description (for screen readers)
                type: string
              - name: caption
                type: string

  - name: gallery
    label: Gallery
    type: file
    path: src/_data/gallery.json
    format: json
    list: true
    fields:
      - name: image
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Description (for screen readers)
        type: string
      - name: featured
        label: Show in the Work page carousel
        type: boolean

  - name: about
    label: About
    type: file
    path: src/about.md
    format: yaml-frontmatter
    fields:
      - name: heading
        type: string
      - name: body
        label: Text
        type: rich-text
      - name: portrait
        label: Drawing
        type: image
      - name: portrait_alt
        label: Drawing description (for screen readers)
        type: string
      - name: portrait_caption
        label: Caption next to the drawing
        type: string
      - name: layout
        type: string
        hidden: true
      - name: permalink
        type: string
        hidden: true
      - name: title
        type: string
        hidden: true

  - name: timeline
    label: Timeline (About page)
    type: file
    path: src/_data/timeline.json
    format: json
    list: true
    fields:
      - name: years
        type: string
      - name: entry
        type: string
      - name: detail
        type: string
      - name: type
        type: select
        options:
          values: [education, work, award, design, teaching]

  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: name
        type: string
      - name: tagline
        type: string
      - name: email
        type: string
      - name: links
        label: Footer links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: url
            type: string
